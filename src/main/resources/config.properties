# ==========================================
# WEB CONFIGURATION
# ==========================================

web.browser=chrome
web.base.url=https://rohitportfolio-chi.vercel.app/


# ==========================================
# MOBILE CONFIGURATION
# ==========================================

mobile.platform=Android
mobile.device.name=Android Emulator

# Leave empty if Appium should use an already
# installed application.
mobile.app=

# Example:
# mobile.app=/Users/rohit/Desktop/apps/my-app.apk

mobile.app.package=
mobile.app.activity=


# ==========================================
# APPIUM
# ==========================================

appium.server.url=http://127.0.0.1:4723


# ==========================================
# TIMEOUT
# ==========================================

explicit.wait.seconds=15